command:
  - ${env}
  - bash
  - ${program}
  - ${args}
program: train_sro_lightning_ddp_wrapper.sh
method: random
entity: sorins_charlatans
project: SRO_Architecture_30k_pH_7.4
metric:
  name: val/loss
  goal: minimize

parameters:
  # --- Fixed paths and settings ---
  use_wandb:
    value: true
  data_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/sro_datasets/ph7.4_30000"
  output_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/refinement_model/architecture_sweep"
  predictions_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/predictions"
  seed:
    value: 42
  
  # --- Fixed System Settings ---
  pH:
    value: 7.4
  temperature:
    value: 310.0

  # --- Lightning specific ---
  use_mixed_precision:
    value: false
  early_stopping_patience:
    value: 0

  # --- Architecture (swept) ---
  c_hidden_mul:
    values: [64, 128]
  c_hidden_att:
    values: [32, 64]
  no_heads_pair:
    values: [2, 4]
  transition_n:
    values: [1, 2, 3]
  num_cycles:
    values: [1]
  dropout_rate:
    values: [0.1, 0.2]
  no_attention:
    values: [true, false]
  initialize_triangle_prior:
    values: [false] # can only be true if no_attention is false
  no_film:
    values: [false]
  train_without_forces:
    values: [false]

  # --- Training HPs (fixed here) ---
  learning_rate:
    value: 1e-4
  weight_decay:
    value: 5e-4
  batch_size:
    value: 2
  max_grad_norm:
    value: 0.1
  beta1:
    value: 0.9
  beta2:
    value: 0.999
  warmup_epochs:
    value: 0.1
  num_epochs:
    value: 5
  gradient_acc_steps:
    value: 60
  logging_frequency:
    value: 15
  train_crop:
    value: 256
  val_crop:
    value: 1024

  # --- Loss Weights (fixed here) ---
  fape_weight:
    value: 1.0
  supervised_chi_weight:
    value: 1.0
  violation_weight:
    value: 1.0
  distogram_weight:
    value: 0.03
  plddt_weight:
    value: 0.03
  rmsd_weight:
    value: 0.02
