command:
  - ${env}
  - bash
  - ${program}
  - ${args}
program: train_sro_lightning_ddp_wrapper.sh
method: bayes
entity: sorins_charlatans
project: SRO_Train_Attention_30k_pH_7.4
metric:
  name: val/loss
  goal: minimize

parameters:
  # --- Fixed paths and settings ---
  use_wandb:
    value: true
  data_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/sro_datasets/ph7.4_30000"
  output_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/refinement_model/architecture_sweep"
  predictions_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/predictions"
  seed:
    value: 42

  # --- Fixed System Settings ---
  pH:
    value: 7.4
  temperature:
    value: 310.0

  # --- Lightning specific ---
  use_mixed_precision:
    value: false
  early_stopping_patience:
    value: 0

  # --- Architecture (fixed) ---
  c_hidden_mul:
    value: 64
  c_hidden_att:
    value: 32
  no_heads_pair:
    value: 4
  transition_n:
    value: 1
  num_cycles:
    value: 1
  dropout_rate:
    value: 0.2
  no_attention:
    value: false
  initialize_triangle_prior:
    values: [true, false]
  no_film:
    value: false
  train_without_forces:
    value: false

  # --- Training HPs (swept) ---
  learning_rate:
    min: 0.000001
    max: 0.001
  weight_decay:
    min: 0.000001
    max: 0.0005
  batch_size:
    value: 2
  max_grad_norm:
    values: [0, 1.0]
  beta1:
    value: 0.9
  beta2:
    value: 0.999
  warmup_epochs:
    values: [0.1, 0.2]
  num_epochs:
    value: 4
  gradient_acc_steps:
    values: [30, 60, 120]
  logging_frequency:
    value: 15
  train_crop:
    value: 256
  val_crop:
    value: 1024

  # --- Loss Weights (fixed here) ---
  fape_weight:
    value: 1.0
  supervised_chi_weight:
    value: 1.0
  violation_weight:
    value: 1.0
  distogram_weight:
    value: 0.03
  plddt_weight:
    value: 0.03
  rmsd_weight:
    value: 0.02
