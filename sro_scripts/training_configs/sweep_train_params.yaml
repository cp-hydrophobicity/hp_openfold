program: run_refinement_model.py
method: bayes
metric:
  name: epoch/val/rmsd
  goal: minimize

parameters:
  # --- Architecture (fixed) ---
  c_hidden_mul:
    value: 64
  c_hidden_att:
    value: 32
  no_heads_pair:
    value: 2
  transition_n:
    value: 1
  num_cycles:
    value: 1
  dropout_rate:
    value: 0.1
  no_attention:
    value: false
  initialize_triangle_prior:
    value: false
  no_film:
    value: false
  train_without_forces:
    value: false

  # --- Training HPs (swept) ---
  learning_rate:
    min: 1e-5
    max: 5e-4
  weight_decay:
    min: 1e-5
    max: 5e-4
  batch_size:
    value: 2
  max_grad_norm:
    values: [0, 1.0]
  beta1:
    value: 0.9
  beta2:
    value: 0.999
  warmup_epochs:
    values: [0.1, 0.2]
  num_epochs:
    value: 4
  gradient_acc_steps:
    values: [10, 30, 50]
  train_crop:
    value: 256
  val_crop:
    value: 1024
  
  # --- Fixed paths and settings ---
  predictions_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/predictions"
  data_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/sro_datasets/ph7.4_30000"
  output_dir:
    value: "/gpfs/data/rsingh47/hp_protein_folding/protein_folding/output/refinement_model/architecture_sweep"
  pH:
    value: 7.4
  use_wandb:
    value: true
  use_slurm:
    value: true
  project_name:
    value: "SRO_Architecture_Sweep"
  seed:
    value: 42

  # --- Loss Weights (fixed here) ---
  fape_weight:
    value: 1.0
  supervised_chi_weight:
    value: 1.0
  violation_weight:
    value: 1.0
  distogram_weight:
    value: 0.03
  plddt_weight:
    value: 0.03
  rmsd_weight:
    value: 0.02
